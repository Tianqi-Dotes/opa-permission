server:
  port: 1111

spring:
  datasource:
    url: jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:postgres}
    username: ${PGUSER:postgres}
    password: ${PGPASSWORD:123456}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: OpaPermissionHikariPool
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.opa.permission.model
  configuration:
    map-underscore-to-camel-case: true

security:
  jwt:
    secret-base64: ${JWT_SECRET_BASE64:}
    expiration-seconds: 900

opa:
  cors:
    allowed-origins: "${CORS_ALLOWED_ORIGINS:http://localhost:5500,http://127.0.0.1:5500}"

trino:
  jdbc-url: ${TRINO_JDBC_URL:jdbc:trino://localhost:8443?SSL=true}
  query:
    max-rows: 1000
    timeout-seconds: 60
