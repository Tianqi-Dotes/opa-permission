services:
  opa:
    image: openpolicyagent/opa:latest
    secrets:
      - github_token
    environment:
      HTTP_PROXY: "http://http.docker.internal:3128"
      HTTPS_PROXY: "http://http.docker.internal:3128"
      ALL_PROXY: "http://http.docker.internal:3128"
      http_proxy: "http://http.docker.internal:3128"
      https_proxy: "http://http.docker.internal:3128"
      all_proxy: "http://http.docker.internal:3128"
      JWT_SECRET_BASE64: "DzrR/mocT7yf8TWgPmgqsrJ8OL4FiaE4Tqgd3VbKb8g="
    ports:
      - "8181:8181"
    mem_limit: 256m
    cpus: 0.25
    command:
      - run
      - --server
      - --addr=0.0.0.0:8181
      - --set=services.github.url=https://raw.githubusercontent.com
      - --set=services.github.credentials.bearer.token_path=/run/secrets/github_token
      - --set=bundles.authorization.service=github
      - --set=bundles.authorization.resource=Tianqi-Dotes/opa-permission/master/bundle.tar.gz
      - --set=bundles.authorization.polling.min_delay_seconds=20
      - --set=bundles.authorization.polling.max_delay_seconds=30
      - --set=decision_logs.console=true

secrets:
  github_token:
    file: ./github_token
