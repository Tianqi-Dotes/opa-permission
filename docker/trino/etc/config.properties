coordinator=true
node-scheduler.include-coordinator=true

# HTTPS is intentionally disabled for this HTTP-only PoC.
# Uncomment and configure these properties when TLS certificates are ready.
# http-server.https.enabled=true
# http-server.https.port=8443
# http-server.https.keystore.path=/etc/trino/certs/trino-keystore.p12
# http-server.https.keystore.key=${ENV:TRINO_HTTPS_KEYSTORE_PASSWORD}
# http-server.https.truststore.path=/etc/trino/certs/trino-truststore.p12
# http-server.https.truststore.key=${ENV:TRINO_HTTPS_TRUSTSTORE_PASSWORD}

http-server.http.port=8080
http-server.authentication.type=JWT
http-server.authentication.allow-insecure-over-http=true
http-server.authentication.jwt.key-file=/etc/trino/jwt-key
http-server.authentication.jwt.required-issuer=opa-permission
http-server.authentication.jwt.principal-field=sub

internal-communication.shared-secret=${ENV:TRINO_INTERNAL_SHARED_SECRET}
discovery.uri=http://localhost:8080
